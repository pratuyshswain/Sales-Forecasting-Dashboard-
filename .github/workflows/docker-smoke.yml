name: Docker smoke checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t local-project .
      - run: docker run --rm --entrypoint python local-project -c 'import os; assert os.getuid() != 0'
      - name: Runtime smoke test
        run: |
          docker run --name smoke --entrypoint sh local-project -ec 'rm -f /app/exports/forecast_12w.csv; exec python etl/etl_pipeline.py'
          docker cp smoke:/app/exports/forecast_12w.csv /tmp/forecast.csv
          test -s /tmp/forecast.csv
          python -c 'import csv; assert len(list(csv.reader(open("/tmp/forecast.csv")))) > 1'
